<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2638" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EAD6B" />
      <stop offset="100%" stop-color="#5CE09C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#151922" />

  <!-- Exam sheet -->
  <rect x="22" y="18" width="56" height="64" rx="8" fill="url(#pageGrad)" stroke="#38445A" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Written text lines -->
  <line x1="32" y1="32" x2="62" y2="32" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="42" x2="68" y2="42" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="52" x2="54" y2="52" stroke="#4A5568" stroke-width="3" stroke-linecap="round" />

  <!-- AI Checkmark badge -->
  <circle cx="64" cy="64" r="14" fill="#151922" stroke="url(#checkGrad)" stroke-width="2.5" />
  <path d="M 57 64 L 62 69 L 71 59" fill="none" stroke="url(#checkGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
